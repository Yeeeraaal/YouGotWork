<!DOCTYPE html>
<html lang="es">

<!-- By Yeeeraaal -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You got work!</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">
    <!-- Archivo de css  -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="images/fondo.mp4" type="video/mp4">
    </video>
    <main class="todo-container">
        <!-- Encabezado de la aplicación -->
        <header class="todo-header">
            <div>
                <img src="/images/youGotWorkTitle.png" alt="You got work!">
            </div>
            <p>Haz que suceda . Un paso a la vez </p>
        </header>

        <!-- Formulario para agregar tareas -->
        <form id="taskForm" class="task-form">
            <input class="task-edit" type="text" id="taskInput" placeholder="Escribe una nueva tarea..."
                autocomplete="off">
            <button type="submit">✚</button>
        </form>
        <!-- Estadística de progreso - porcentaje -->
        <section class="statistics" aria-label="Estadísticas de tareas">

            <div class="statistics-header">
                <span>Tu progreso</span>
                <span id="percentageText">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>

            <div class="statistics-details">
                <span id="pendingStats">♡ 0 pendientes</span>
            </div>
        </section>
        <!-- Mensaje cuando se intenta agregar una tarea vacía -->
        <p id="validationMessage" class="validation-message"></p>

        <!-- Lista donde JavaScript agregará las tareas -->
        <ul id="taskList" class="task-list"></ul>

        <!-- Contador de progreso -->
        <div class="progress">
            <span id="progressText">0 de 0 completadas</span>
        </div>

    </main>

    <!-- Archivo de JavaScript -->
    <script src="script.js"></script>

</body>

</html>
